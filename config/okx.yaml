# OKX Exchange Configuration
# Copy .env.example to .env and fill in your OKX API keys

exchange:
  id: "okx"
  sandbox: true              # Use OKX demo trading environment
  timeout: 30000
  rate_limit: 20             # OKX has stricter rate limits

market:
  type: "spot"
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
  quote_currency: "USDT"
  timeframe: "5m"

strategy:
  active: "grid"
  min_profit_buffer_pct: 0.08

grid:
  upper_price: null
  lower_price: null
  grid_count: 10
  order_amount: 50

risk:
  max_position_pct: 10
  max_leverage: 1
  max_daily_loss_pct: 5
  max_drawdown_pct: 20
  cooldown_seconds: 60
  max_concurrent_positions: 3

logging:
  level: "INFO"
  format: "json"
  trade_journal: "data/logs/okx_trades.csv"

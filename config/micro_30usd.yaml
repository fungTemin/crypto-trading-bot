# Micro Account Configuration — 30 USD
# Optimized for small capital with conservative risk management

exchange:
  id: "binance"
  sandbox: true              # Always test first!
  timeout: 30000
  rate_limit: 50             # Conservative rate limit

market:
  type: "spot"
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
  quote_currency: "USDT"
  timeframe: "15m"           # Longer timeframe for fewer signals

strategy:
  active: "grid"
  min_profit_buffer_pct: 0.15  # Higher buffer for small account (fees eat more %)

grid:
  upper_price: null          # Auto-detect from 24h high
  lower_price: null
  grid_count: 5              # Fewer grids for 30 USD
  order_amount: 5            # 5 USDT per grid level (5 grids × 5 USDT = 25 USDT max exposure)

mean_reversion:
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 25           # More conservative entry
  rsi_overbought: 75
  confirmation_candles: 3

trend_following:
  fast_ema: 12
  slow_ema: 26
  signal_ema: 9
  atr_period: 14
  atr_multiplier: 2.5        # Wider trailing stop

risk:
  max_position_pct: 15       # Max 15% per position (4.5 USD)
  max_leverage: 1            # No leverage for micro accounts
  max_daily_loss_pct: 3      # Tight daily loss limit (0.9 USD)
  max_drawdown_pct: 15       # Circuit breaker at 15% drawdown (4.5 USD)
  cooldown_seconds: 120      # Longer cooldown to avoid overtrading
  max_concurrent_positions: 2 # Max 2 positions at once

backtest:
  start_date: "2025-01-01"
  end_date: "2026-01-01"
  initial_capital: 30        # 30 USD starting capital
  fee_rate: 0.001            # 0.1% per side
  slippage_rate: 0.001       # Higher slippage assumption for small orders

# Initial capital for paper trading (override in backtest section)
paper:
  initial_capital: 30        # 30 USD

logging:
  level: "INFO"
  format: "json"
  trade_journal: "data/logs/trades_micro.csv"

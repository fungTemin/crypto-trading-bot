# Crypto Trading Bot — Base Configuration
# All values can be overridden by mode-specific configs or env vars.

exchange:
  id: "binance"              # ccxt exchange id: binance, okx, bybit, coinbase, kraken
  sandbox: true              # use testnet/sandbox
  timeout: 30000             # API timeout in ms
  rate_limit: 100            # max requests per second (ccxt handles backoff)

market:
  type: "spot"               # spot | future | swap
  symbols:                    # trading pairs
    - "BTC/USDT"
    - "ETH/USDT"
  quote_currency: "USDT"
  timeframe: "5m"            # 1m, 5m, 15m, 1h, 4h, 1d

strategy:
  active: "grid"             # grid | mean_reversion | trend_following | composite
  min_profit_buffer_pct: 0.05  # extra buffer beyond fees (e.g. 0.05% minimum net profit)

grid:
  upper_price: null          # auto-detect from 24h high if null
  lower_price: null
  grid_count: 20
  order_amount: 100          # quote currency per grid level

mean_reversion:
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  confirmation_candles: 2

trend_following:
  fast_ema: 12
  slow_ema: 26
  signal_ema: 9              # MACD signal line
  atr_period: 14
  atr_multiplier: 2.0        # trailing stop = price ± ATR * multiplier

risk:
  max_position_pct: 10       # max % of equity per position
  max_leverage: 1            # spot=1, futures can be higher
  max_daily_loss_pct: 5      # stop trading if daily loss > 5%
  max_drawdown_pct: 20       # circuit breaker: halt if drawdown > 20%
  cooldown_seconds: 60       # min seconds between trades on same symbol
  max_concurrent_positions: 5

backtest:
  start_date: "2025-01-01"
  end_date: "2026-01-01"
  initial_capital: 10000
  fee_rate: 0.001            # 0.1% per side
  slippage_rate: 0.0005      # 0.05%

logging:
  level: "INFO"              # DEBUG | INFO | WARNING | ERROR
  format: "json"             # json | text
  trade_journal: "data/logs/trades.csv"

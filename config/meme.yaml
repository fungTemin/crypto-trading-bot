# Meme Coin Spot Trading — OKX Small Account ($30)
# 22币种覆盖：Meme + 小市值 + 中市值波动币

exchange:
  id: "okx"
  sandbox: false
  timeout: 15000

market:
  type: "spot"
  symbols:
    # Meme coins (7)
    - "PEPE/USDT"
    - "FLOKI/USDT"
    - "WIF/USDT"
    - "BONK/USDT"
    - "MEME/USDT"
    - "SHIB/USDT"
    - "DOGE/USDT"
    # Extra meme (5)
    - "TURBO/USDT"
    - "MEW/USDT"
    - "BOME/USDT"
    - "NEIRO/USDT"
    - "BABYDOGE/USDT"
    # Small cap / narrative (6)
    - "PEOPLE/USDT"
    - "ORDI/USDT"
    - "AGLD/USDT"
    - "ID/USDT"
    - "ACE/USDT"
    - "BIGTIME/USDT"
    # Mid cap volatile (4)
    - "TRB/USDT"
    - "YGG/USDT"
    - "PENDLE/USDT"
    - "ARKM/USDT"
  quote_currency: "USDT"
  timeframe: "3m"

strategy:
  active: "meme_scalper"

meme_scalper:
  min_volume_usdt: 200000
  volume_spike_ratio: 2.5
  momentum_lookback: 6
  ema_period: 5
  rsi_period: 8
  rsi_entry_min: 35
  rsi_entry_max: 65
  take_profit_pct: 2.0
  stop_loss_pct: 2.5
  max_hold_minutes: 45
  trailing_stop_pct: 1.0

risk:
  max_position_pct: 40
  max_leverage: 3
  max_daily_loss_pct: 15
  max_drawdown_pct: 25
  cooldown_seconds: 30
  max_concurrent_positions: 5

logging:
  level: "INFO"
  format: "text"
  trade_journal: "data/logs/meme_trades.csv"

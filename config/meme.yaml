# Meme Coin Spot Trading — OKX Small Account ($30)
# 30币种 | 基于实时市场波动率扫描筛选

exchange:
  id: "okx"
  sandbox: false
  timeout: 15000

market:
  type: "spot"
  symbols:
    # Meme coins (12)
    - "PEPE/USDT"
    - "FLOKI/USDT"
    - "WIF/USDT"
    - "BONK/USDT"
    - "MEME/USDT"
    - "SHIB/USDT"
    - "DOGE/USDT"
    - "TURBO/USDT"
    - "MEW/USDT"
    - "BOME/USDT"
    - "NEIRO/USDT"
    - "BABYDOGE/USDT"
    # Today's top volatility (24h scan: 20-59% range)
    - "DOGS/USDT"       # +71.4%, 59% daily range
    - "HMSTR/USDT"      # +21.9%, 33% range
    - "NOT/USDT"        # +23.1%, 29% range
    - "DUCK/USDT"       # +11.6%, 31% range
    - "CAT/USDT"        # +7.8%, $50B vol
    # High volatility small/mid caps
    - "JTO/USDT"        # 27% range
    - "STORJ/USDT"      # 27% range
    - "CFG/USDT"        # 20% range
    - "CATI/USDT"       # 20% range
    - "VIRTUAL/USDT"    # 17% range
    - "MAJOR/USDT"      # 19% range
    - "ICP/USDT"        # 18% range
    - "BIO/USDT"        # 17% range
    - "VINE/USDT"       # 16% range
    # Large cap volatile
    - "NEAR/USDT"       # 13% range
    - "OP/USDT"         # 13% range
    - "ENA/USDT"        # 12% range
    - "STRK/USDT"       # 12% range
    - "ONDO/USDT"       # 11% range
    - "ZK/USDT"         # 11% range
  quote_currency: "USDT"
  timeframe: "3m"

strategy:
  active: "meme_scalper"

meme_scalper:
  min_volume_usdt: 100000
  volume_spike_ratio: 1.2
  momentum_lookback: 6
  ema_period: 5
  rsi_period: 8
  rsi_entry_min: 35
  rsi_entry_max: 65
  take_profit_pct: 2.0
  stop_loss_pct: 2.5
  max_hold_minutes: 45
  trailing_stop_pct: 1.0

risk:
  max_position_pct: 40
  max_leverage: 3
  max_daily_loss_pct: 15
  max_drawdown_pct: 25
  cooldown_seconds: 30
  max_concurrent_positions: 5

logging:
  level: "INFO"
  format: "text"
  trade_journal: "data/logs/meme_trades.csv"

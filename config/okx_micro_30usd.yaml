# OKX Micro Account Configuration — 30 USD
# Optimized for meme coins and low-value mainstream coins

exchange:
  id: "okx"
  sandbox: true              # Always test on demo first!
  timeout: 30000
  rate_limit: 20

market:
  type: "spot"
  symbols:
    - "DOGE/USDT"            # Meme coin - Dogecoin
    - "SHIB/USDT"            # Meme coin - Shiba Inu
    - "PEPE/USDT"            # Meme coin - Pepe
    - "XRP/USDT"             # Low-value mainstream
    - "ADA/USDT"             # Low-value mainstream
    - "SOL/USDT"             # Mainstream altcoin
  quote_currency: "USDT"
  timeframe: "5m"            # Shorter timeframe for volatility

strategy:
  active: "mean_reversion"   # Better for volatile meme coins
  min_profit_buffer_pct: 0.2 # Higher buffer for meme coin volatility

# Grid settings for low-value coins
grid:
  upper_price: null          # Auto-detect
  lower_price: null
  grid_count: 5
  order_amount: 5            # 5 USDT per grid level

risk:
  max_position_pct: 15       # Max 15% per position (4.5 USD)
  max_leverage: 1
  max_daily_loss_pct: 3      # Tight daily loss limit (0.9 USD)
  max_drawdown_pct: 15       # Circuit breaker at 15%
  cooldown_seconds: 120      # Longer cooldown
  max_concurrent_positions: 2

logging:
  level: "DEBUG"
  format: "json"
  trade_journal: "data/logs/okx_micro_trades.csv"
  operation_log: "data/logs/okx_operations.jsonl"
